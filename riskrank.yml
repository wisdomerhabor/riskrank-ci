# RiskRank settings for this repository (FR12). Changing a value here needs no code change.
repository: wisdomerhabor/riskrank-ci
budget: 20                      # percent
budget_unit: lines              # artefacts | lines
ranking_key: default            # default | effort
risk_threshold: 0.5
models:
  module: {version: flask-module-v3, sha256: fcb0640b2cd23163bf7c5bac389b165ef415d5a7737d9c994ffe37103672f4d9}
  commit: {version: apachejit-jit-v1, sha256: 519cd8c7f358d4ad5f1b250a26df964ed8d7f93210e9906ddf40161c464a9f44}
scoring_timeout_seconds: 60
coverage_refresh_interval: weekly
stop_at_first_failure: false
run_only_in_budget: false
source_roots: ["src/riskrank/"]
exclude_paths: ["tests/"]
deploying_team: ["wisdomerhabor2@gmail.com"]   # FR8: only these authors' commits get a commit-level score
