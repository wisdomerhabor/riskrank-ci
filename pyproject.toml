[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskrank"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "imbalanced-learn==0.14.2",
    "lightgbm==4.7.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
    "PyYAML==6.0.3",
    "radon==6.0.1",
    "Flask==3.1.3",
    "gunicorn==26.2.0",
    "coverage",
]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
