# PRE-REGISTERED Flask mining rules (Chapter Three, section 3.5.1).
# Fixed 8 Nov 2026 by the student, BEFORE any SZZ label was produced. The commit that adds this
# file is the evidence of that order. Changing anything here after labelling must be a new,
# separately reported variant, never an edit to this file.

repository: pallets/flask
history_end_commit: 49943b5a94413a530761350f04e896f76e8d620e   # main, 30 Oct 2026

source_modules:            # modules = .py files at any depth under these roots; SZZ traces only these
  - "flask/"               # layout until June 2019
  - "src/flask/"           # layout from June 2019
exclude_paths: ["tests/", "docs/", "examples/", "flask/testsuite/"]
# AMENDED 8 Nov 2026, still before any label was produced: the first version used the globs
# "flask/*.py" and "src/flask/*.py", which would have dropped the json/ and sansio/ subpackages
# (6 of today's 24 modules) and did not exclude the pre-2014 in-package test suite
# flask/testsuite/. Corrected to roots plus that exclusion.

bug_fix_rule:
  # A non-merge commit is a bug fix if (a) it references an issue labelled `bug`, or (b) its
  # message contains a fix keyword as a whole word, AND its subject does not match an exclusion.
  issue_reference: "#(\\d+)"
  issue_label: bug
  keywords: "\\b(fix|fixes|fixed|fixing|bug|bugs|defect|defects|patch|patched|patches)\\b"
  exclude_subject: "\\b(typo|typos|typing|type hints?|mypy|lint|flake8|docs?|docstrings?|style|format|formatting|pre-commit|ci)\\b"
  case_insensitive: true
  issue_cache: data/github/flask_issues.json   # labels and created_at, fetched 8 Nov 2026

szz:
  tool: PySZZ v2, commit 67971581881993231b6918128436e1f06239c781, image tools/pyszz
  variant: R-SZZ                      # MA-SZZ candidates, latest by committed date
  config: conf/rszz_issues_filter.yml  # as published: max_change_size 20, -M, -C same commit
  issue_date_filter: true             # applied where the fix references an issue with a date
  file_ext_to_parse: [py]
  cosmetic_filter: as built into MA-SZZ (whitespace, comments, meta changes)

module_snapshots:
  interval: quarterly                 # 1 Jan, 1 Apr, 1 Jul, 1 Oct, UTC
  observation_window_months: 12       # fixes counted after the snapshot
  process_period_months: 12           # churn, changes, prior fixes counted before the snapshot
  truncated_windows: discard          # snapshots whose window runs past history_end are dropped
  truncated_process_period: discard   # AMENDED 8 Nov 2026, before any label: the first snapshot is
                                      # the first quarter boundary >= 12 months after the first
                                      # commit, so no process period is truncated either
  size: Radon sloc (non-blank, non-comment source lines)
  complexity: sum of Radon McCabe complexity over functions and methods (class totals not added)
  prior_fixes: fix keywords alone, no issue labels (Table 3.7)
  calibration: final fifth of training snapshots by date
  rule: >
    A module is defective at a snapshot if a bug-fixing commit within the observation window
    changed lines in it that R-SZZ traces to an inducing commit made on or before the snapshot.

commit_level:
  split_date: latest date leaving >= 30 defect-inducing commits in the held-out period, set from
              label counts alone before any model is trained
  gap: final year before the split date
  calibration: final fifth of the time before the gap

deployment_model:
  fork_point: "2025-03-30"            # plan D5: deployed Flask model sees only pre-fork history
  fork_commit: b78b5a21                # last upstream main (first-parent) commit before the fork point
  replay: one sync-merge per upstream first-parent commit after fork_commit; a push counts only if
          it changes a source module
# AMENDED 8 Nov 2026 (student's decision), before any replay push: the fork point was 2025-11-07,
# which leaves only 27 source-changing first-parent pushes (29 non-merge commits) up to the history
# end, below the 30 counted pushes Table 1.1 requires. An earlier count of 34 used the GitHub API's
# date filter, which also includes commits authored before but merged after the date. 2025-03-30
# leaves 34 (margin 4). The deployed module model is re-fitted for it as flask-module-v2.

# ADDED 8 Nov 2026 (student's decision), before any held-out score was computed: the offline
# evaluation of the deployed module model (FR13, FR15). Held-out data are the snapshots dated after
# the fork point, so no held-out label overlaps the training or calibration labels (the last training
# snapshot is 2024-01-01). The two-project mined corpus is reported as effect sizes only (section 3.5).
offline_evaluation:
  model: flask-module-v2
  held_out: every module snapshot dated after fork_point   # 2025-04-01, 2025-07-01, 2025-10-01
  ranked_set: each snapshot on its own; results per snapshot and their mean over snapshots
  budget: 20 percent; artefacts and lines (offline fractional boundary); keys default and effort
  baselines:
    random: exact k/n for artefacts; mean of 100 seeded permutations (seed 0) for lines
    largest_first: size descending, then module path ascending
    smallest_first: size ascending, then module path ascending
    recency: time of the module's last content-changing commit before the snapshot, newest first
  curve: offline recall at lines budgets 0-100 percent in 1-point steps, mean over snapshots
  calibration: reliability in 10 equal-width bins over all held-out rows pooled; Brier score
  significance: none (too few projects); effect direction and rank-biserial over the snapshots only

# ADDED 8 Nov 2026 (student's decision: minimum 20), before any candidate separation date, anchor count
# or recall was examined: the first bounded check (section 3.10.3), runtime-set defect recall.
first_check:
  training_snapshot_minimum: 20       # labelled module snapshots whose 12-month window ends strictly before the date
  candidate_dates: first commit (committer time, history_end_commit's first-parent and merged history) of each calendar month
  separation_date: earliest candidate date meeting the minimum; recorded before any recall is calculated
  validation_model: >-
    trained only on those snapshots, as the deployed model is (families lr, rf, lgbm tuned for equal
    seconds with seed 42, chosen by tuning AUC-PR; final fifth of the training snapshots by date for
    calibration); ranks by the default key
  anchors: R-SZZ inducing commits (rszz.jsonl) committed on or after the separation date and not merges
  ranked_set: the scoreable source modules the anchor commit touches (diff against its first parent), with
    features computed by riskrank.hook.module_features up to and including the anchor
  label: a ranked module is defective when R-SZZ blames it for that anchor (union of blamed_files over every
    fix whose inducing commit is the anchor, each path followed back through renames to its name at the anchor)
  exclusions_counted: blamed modules all outside the ranked set; every ranked module blamed; blamed files
    the anchor did not touch (removed from the label and counted)
  budget: 20 percent; artefacts and lines, runtime boundary kept whole (riskrank.budget.mark)
  chance: artefacts = realised share; lines = mean recall over every module order (100 seeded orders, seed 0,
    above 8 modules) with the 2.5-97.5 percentile interval
  baselines: largest-first (artefacts), smallest-first (lines), recency (last content change strictly before
    the anchor, newest first, none last); ties by ascending module path
  minimum_anchors: 12                 # fewer makes the check uninformative
  reporting: descriptive only; per-anchor difference from its own chance level, mean and spread; mean recall
    for the system and each baseline with the number of anchors
