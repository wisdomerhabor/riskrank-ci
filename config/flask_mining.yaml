# PRE-REGISTERED Flask mining rules (Chapter Three, section 3.5.1).
# Fixed 8 Nov 2026 by the student, BEFORE any SZZ label was produced. The commit that adds this
# file is the evidence of that order. Changing anything here after labelling must be a new,
# separately reported variant, never an edit to this file.

repository: pallets/flask
history_end_commit: 49943b5a94413a530761350f04e896f76e8d620e   # main, 30 Oct 2026

source_modules:            # modules = .py files at any depth under these roots; SZZ traces only these
  - "flask/"               # layout until June 2019
  - "src/flask/"           # layout from June 2019
exclude_paths: ["tests/", "docs/", "examples/", "flask/testsuite/"]
# AMENDED 8 Nov 2026, still before any label was produced: the first version used the globs
# "flask/*.py" and "src/flask/*.py", which would have dropped the json/ and sansio/ subpackages
# (6 of today's 24 modules) and did not exclude the pre-2014 in-package test suite
# flask/testsuite/. Corrected to roots plus that exclusion.

bug_fix_rule:
  # A non-merge commit is a bug fix if (a) it references an issue labelled `bug`, or (b) its
  # message contains a fix keyword as a whole word, AND its subject does not match an exclusion.
  issue_reference: "#(\\d+)"
  issue_label: bug
  keywords: "\\b(fix|fixes|fixed|fixing|bug|bugs|defect|defects|patch|patched|patches)\\b"
  exclude_subject: "\\b(typo|typos|typing|type hints?|mypy|lint|flake8|docs?|docstrings?|style|format|formatting|pre-commit|ci)\\b"
  case_insensitive: true
  issue_cache: data/github/flask_issues.json   # labels and created_at, fetched 8 Nov 2026

szz:
  tool: PySZZ v2, commit 67971581881993231b6918128436e1f06239c781, image tools/pyszz
  variant: R-SZZ                      # MA-SZZ candidates, latest by committed date
  config: conf/rszz_issues_filter.yml  # as published: max_change_size 20, -M, -C same commit
  issue_date_filter: true             # applied where the fix references an issue with a date
  file_ext_to_parse: [py]
  cosmetic_filter: as built into MA-SZZ (whitespace, comments, meta changes)

module_snapshots:
  interval: quarterly                 # 1 Jan, 1 Apr, 1 Jul, 1 Oct, UTC
  observation_window_months: 12       # fixes counted after the snapshot
  process_period_months: 12           # churn, changes, prior fixes counted before the snapshot
  truncated_windows: discard          # snapshots whose window runs past history_end are dropped
  truncated_process_period: discard   # AMENDED 8 Nov 2026, before any label: the first snapshot is
                                      # the first quarter boundary >= 12 months after the first
                                      # commit, so no process period is truncated either
  size: Radon sloc (non-blank, non-comment source lines)
  complexity: sum of Radon McCabe complexity over functions and methods (class totals not added)
  prior_fixes: fix keywords alone, no issue labels (Table 3.7)
  calibration: final fifth of training snapshots by date
  rule: >
    A module is defective at a snapshot if a bug-fixing commit within the observation window
    changed lines in it that R-SZZ traces to an inducing commit made on or before the snapshot.

commit_level:
  split_date: latest date leaving >= 30 defect-inducing commits in the held-out period, set from
              label counts alone before any model is trained
  gap: final year before the split date
  calibration: final fifth of the time before the gap

deployment_model:
  fork_point: "2025-03-30"            # plan D5: deployed Flask model sees only pre-fork history
  fork_commit: b78b5a21                # last upstream main (first-parent) commit before the fork point
  replay: one sync-merge per upstream first-parent commit after fork_commit; a push counts only if
          it changes a source module
# AMENDED 8 Nov 2026 (student's decision), before any replay push: the fork point was 2025-11-07,
# which leaves only 27 source-changing first-parent pushes (29 non-merge commits) up to the history
# end, below the 30 counted pushes Table 1.1 requires. An earlier count of 34 used the GitHub API's
# date filter, which also includes commits authored before but merged after the date. 2025-03-30
# leaves 34 (margin 4). The deployed module model is re-fitted for it as flask-module-v2.

# ADDED 8 Nov 2026 (student's decision), before any held-out score was computed: the offline
# evaluation of the deployed module model (FR13, FR15). Held-out data are the snapshots dated after
# the fork point, so no held-out label overlaps the training or calibration labels (the last training
# snapshot is 2024-01-01). The two-project mined corpus is reported as effect sizes only (section 3.5).
offline_evaluation:
  model: flask-module-v2
  held_out: every module snapshot dated after fork_point   # 2025-04-01, 2025-07-01, 2025-10-01
  ranked_set: each snapshot on its own; results per snapshot and their mean over snapshots
  budget: 20 percent; artefacts and lines (offline fractional boundary); keys default and effort
  baselines:
    random: exact k/n for artefacts; mean of 100 seeded permutations (seed 0) for lines
    largest_first: size descending, then module path ascending
    smallest_first: size ascending, then module path ascending
    recency: time of the module's last content-changing commit before the snapshot, newest first
  curve: offline recall at lines budgets 0-100 percent in 1-point steps, mean over snapshots
  calibration: reliability in 10 equal-width bins over all held-out rows pooled; Brier score
  significance: none (too few projects); effect direction and rank-biserial over the snapshots only

# ADDED 8 Nov 2026 (student's decision: minimum 20), before any candidate separation date, anchor count
# or recall was examined: the first bounded check (section 3.10.3), runtime-set defect recall.
first_check:
  training_snapshot_minimum: 20       # labelled module snapshots whose 12-month window ends strictly before the date
  candidate_dates: first commit (committer time, history_end_commit's first-parent and merged history) of each calendar month
  separation_date: earliest candidate date meeting the minimum; recorded before any recall is calculated
  validation_model: >-
    trained only on those snapshots, as the deployed model is (families lr, rf, lgbm tuned for equal
    seconds with seed 42, chosen by tuning AUC-PR; final fifth of the training snapshots by date for
    calibration); ranks by the default key
  anchors: R-SZZ inducing commits (rszz.jsonl) committed on or after the separation date and not merges
  ranked_set: the scoreable source modules the anchor commit touches (diff against its first parent), with
    features computed by riskrank.hook.module_features up to and including the anchor
  label: a ranked module is defective when R-SZZ blames it for that anchor (union of blamed_files over every
    fix whose inducing commit is the anchor, each path followed back through renames to its name at the anchor)
  exclusions_counted: blamed modules all outside the ranked set; every ranked module blamed; blamed files
    the anchor did not touch (removed from the label and counted)
  budget: 20 percent; artefacts and lines, runtime boundary kept whole (riskrank.budget.mark)
  chance: artefacts = realised share; lines = mean recall over every module order (100 seeded orders, seed 0,
    above 8 modules) with the 2.5-97.5 percentile interval
  baselines: largest-first (artefacts), smallest-first (lines), recency (last content change strictly before
    the anchor, newest first, none last); ties by ascending module path
  minimum_anchors: 12                 # fewer makes the check uninformative
  reporting: descriptive only; per-anchor difference from its own chance level, mean and spread; mean recall
    for the system and each baseline with the number of anchors

# ADDED 8 Nov 2026 (plan D6 item 4; agent's design under the student's overnight instruction "use your best
# recommendation"), BEFORE any commit-level model was trained or scored: the exploratory static-versus-process
# comparison at commit level (section 3.8.2; Table 3.6). The split date below was computed from label counts
# alone, as commit_level requires: it is the author time of the 30th-latest R-SZZ inducing commit.
static_vs_process:
  corpus: data/mined/flask/commits.csv     # riskrank.mining.commits: 1,393 commits touching a source module, 131 inducing
  split_date: "2018-04-27T19:27:31Z"       # test = commits at or after it (524 commits, 30 inducing, any fix to history end)
  gap: the year before split_date (122 commits, used for nothing)
  training: commits before the gap (747); bug-inducing only if the earliest fix is before split_date (82; 5 relabelled clean)
  calibration: final fifth of the time from the first commit to the start of the gap; base = the rest
  feature_sets:
    static: [touched_size, touched_complexity]
    static_process: [la, ld, nf, nd, ns, ent, ndev, age, nuc, aexp, arexp, asexp, touched_size, touched_complexity]
  correlation_filter: within each family (static, process), as everywhere else
  families: [lr, rf, lgbm, mlp]
  tuning: expanding time folds on base data, 60 seconds per family and imbalance method, seed 42 (as the run of record; idle machine)
  measures: AUC-PR on uncalibrated test scores with its chance level, ROC-AUC, Brier (calibrated)
  comparison: AUC-PR(static_process) minus AUC-PR(static), per family; headline family = highest tuning AUC-PR on static_process
  transfer_check: the deployed apachejit-jit-v1, unchanged, scores the same test commits; AUC-PR and ROC-AUC (Table 3.6)
  reporting: effect sizes only, no significance tests (two-project mined corpus; Gin not yet mined)

# ADDED 9 Nov 2026 (plan D6 item 5; agent's design under the student's overnight instruction), BEFORE any
# historical build was attempted or any test run: the second bounded check (section 3.10.3), early fault
# detection with an executed, back-ported test. Every rule below restates section 3.10.3 or fixes a detail
# it leaves open; the details are marked "detail".
second_check:
  separation_date: the first check's (runs/first_check_date.json, 2017-04-02T00:37:19Z)
  validation_model: >-
    the first check's validation model, rebuilt exactly from its recorded family, imbalance method and
    hyperparameters (runs/first_check.json) on the same base and calibration snapshots with seed 42; not re-tuned
  candidates: non-merge bug fixes (bugfixes.json) dated on or after the separation date; anchor = the fix's first parent.
    Section 3.10.3's tentative 2020 cut-off is confirmed by attempting every candidate and reporting build failures by year
  environment (detail): >-
    a fresh virtual environment per anchor with the newest CPython minor release published before the anchor's
    committer date (3.6 from 2016-12-23, 3.7 from 2018-06-27, 3.8 from 2019-10-14, 3.9 from 2020-10-05, 3.10 from
    2021-10-04, 3.11 from 2022-10-24, 3.12 from 2023-10-02, 3.13 from 2024-10-07), provided by uv; every package
    resolved as of the anchor's committer date (uv --exclude-newer); the project installed editable; test
    dependencies from requirements/tests.txt if present, else the pyproject dependency group "tests", else the
    unconditional deps of tox.ini's [testenv]; plus pytest-cov. A Python version uv cannot provide is a build failure
  tests_added (detail): >-
    test functions in pytest's default naming (functions starting 'test', top level or in classes starting 'Test') under tests/ present at the fix and absent at the parent,
    by file, class and name; a parametrised test counts once
  back_port (detail): >-
    the added test's source at the fix, with its decorators, is appended to the same file at the anchor (inside its
    class when it is a method and the class exists there); a file new in the fix is copied whole. Nothing else changes
  assertion_failure (detail): >-
    a pytest failure (not a setup/collection error) whose exception is AssertionError or pytest's own Failed
    (pytest.fail, pytest.raises "DID NOT RAISE"); any other exception type counts as an error
  runs: full suite once at the anchor without coverage (must pass, skips allowed; supplies every duration); the added
    test at the fix (must pass); the back-ported test three times at the anchor
  exclusion_order: [build_failure, suite_fails_at_parent, not_exactly_one_test_added, added_test_fails_at_fix,
    backport_error_or_not_applicable, backport_passes_all_three, flaky]   # each defect counted once, first match
  ranking: every source module at the anchor (riskrank.hook.module_features up to and including the anchor), scored by
    the validation model, default key; largest-first (size desc, path asc); recency (last content change up to and
    including the anchor, newest first, none last, path asc); random = (n + 1) / 2, APFD = APFDc = 0.5 exactly
  coverage: per-test contexts collected at the anchor with the back-ported test included; mapping by riskrank.testplan.build_plan,
    the same for the system and both module baselines; no budget (every ranked module counts)
  measures: failing-test position TF, APFD = 1 - TF/n + 1/(2n), APFDc = (T - B - t/2) / T with the eligibility-run
    durations and the back-ported test's median failing duration; tie-group size of the back-ported test; tests that
    must precede it under any ranking; the pessimistic bound (back-ported test treated as covering only its
    lowest-ranked module); ranked modules it covers
  minimum: fewer than 12 reproduced defects -> each reported individually, no mean, no comparative conclusion
  # AMENDED 9 Nov 2026, after a first screen found the environments could not be rebuilt as specified and BEFORE any
  # defect was reproduced (that screen's records are kept in runs/second_check/aborted/): (1) the project is installed
  # normally with every package dated, then re-installed editable with no dependencies, its isolated build backend
  # (setuptools, wheel) dated 2026-11-09, because setuptools before 64 cannot build the editable install uv needs;
  # (2) packages are byte-compiled at install, as pip does, so the project's "warnings are errors" setting does not fail
  # on old packages' compile-time deprecation warnings; (3) setuptools is installed dated, as every virtualenv of the
  # time had it; (4) branch archives that tox.ini's [testenv] installs (the sibling Pallets libraries in development,
  # 2017-2021 and 2023) are installed at their last commit on or before the anchor's committer date. Unchanged: a
  # Python version uv cannot provide is a build failure (this workstation, Apple silicon: no 3.6 or 3.7).
  measurement_tools (detail): >-
    coverage.py and a small results plugin (tools/second_check) are installed WITHOUT the date limit, at the newest
    versions supporting the anchor's Python: per-test coverage contexts need coverage 5.0 (Dec 2019), so a dated
    install could not measure older anchors. The project and its own test dependencies stay dated. Per-test contexts
    are switched by node id at each test's setup; a test exercises a module when any of its contexts ran a line in it
  durations (detail): call-phase durations, as the deployed system's coverage workflow records them
  parametrised (detail): TF is the position of the earliest-placed failing case of the back-ported test; its t is that
    case's median failing duration; its other cases are in n and T with their own median durations
  model_check (detail): the rebuilt validation model must reproduce the recorded MCC threshold and Platt slope (1e-9)
