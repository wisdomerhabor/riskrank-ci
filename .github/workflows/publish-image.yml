# Build the scoring service image on GitHub's amd64 runners and publish it to GHCR on each release tag.
name: publish-image
on:
  push: {tags: ["v*"]}
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/riskrank-scoring:${{ github.ref_name }}
